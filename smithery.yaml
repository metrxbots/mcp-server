# Metrx MCP Server — AI Agent Cost Intelligence
# Smithery registry configuration
# https://smithery.ai

name: 'Metrx MCP Server'
description: >
  Metrx is how a company manages the AI agents it employs, from any source you
  can export. Each agent gets a job contract, a scorecard against it, and a P&L:
  what it cost and what it produced. 43 MCP tools: workforce review, job
  contracts and scorecards, vendor bill checks, measured cost per agent from the
  SDKs and OTel, budgets and alerts, cost-leak scans, and model-switch
  experiments that change nothing without your OK. With no API key, the public
  desk tools answer over the synthetic Northwind sample (--demo). One tool,
  metrx_get_my_access, is listed only to a person signed in through the connector,
  never to an API key. Works with
  Claude Desktop, Cursor, Windsurf and any MCP client.
version: '0.6.4'

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      metrxApiKey:
        type: string
        description: 'Your Metrx API key (get one free at metrxbot.com). Leave empty to try the public desk tools over the synthetic Northwind sample (--demo).'

  commandFunction: |-
    (config) => (config.metrxApiKey
      ? {
          command: 'npx',
          args: ['@metrxbot/mcp-server'],
          env: { METRX_API_KEY: config.metrxApiKey }
        }
      : { command: 'npx', args: ['@metrxbot/mcp-server', '--demo'], env: {} })
